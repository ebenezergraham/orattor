name: Android release (Play Console internal track)

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "android/**"
      - "assets/**"
      - "pubspec.yaml"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      # A stock ubuntu-latest runner reprovisions the Android SDK's CMake/NDK
      # native-build tools on every uncached run, which can stall for 10+
      # minutes right before the release build step. Same fix as Panthenova.
      - name: Prepare Android SDK directory for caching
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk/cmake
          sudo mkdir -p /usr/local/lib/android/sdk/ndk
          sudo chown -R $USER:$USER /usr/local/lib/android/sdk/cmake /usr/local/lib/android/sdk/ndk

      - name: Cache Android SDK native build tools (cmake/ndk)
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/cmake
            /usr/local/lib/android/sdk/ndk
          key: android-sdk-native-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: |
            android-sdk-native-${{ runner.os }}-

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Write Play Console service account key
        run: echo '${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}' > android/play-service-account.json

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      - name: Build release App Bundle
        timeout-minutes: 45
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: android

      - name: Upload to Play Console (internal testing track)
        working-directory: android
        env:
          PLAY_STORE_JSON_KEY_PATH: play-service-account.json
        run: bundle exec fastlane android internal

      - name: Clean up secrets from workspace
        if: always()
        run: |
          rm -f android/key.properties android/app/upload-keystore.jks android/play-service-account.json
